[project]
name = "wildfire-twin-data-pipeline"
version = "0.1.0"
description = "Offline GIS preprocessing for WildfireTwinLA"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2,<3",
  "planetary-computer>=1,<2",
  "pystac-client>=0.8,<1",
  "rasterio>=1.4,<2",
]

[project.scripts]
wildfire-grid = "wildfire_grid.cli:main"
wildfire-sentinel = "wildfire_grid.sentinel:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wildfire_grid"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.7,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
